<?xml version="1.0" encoding="UTF-8"?>
<!--
  rmd 产品图标唯一可编辑源（INV-APP-05）。
  2026-10-24：用户选定黑灰 R＋折页＋书签方案，按参考图重绘。
  make icon 生成 PNG / ICNS；只用几何路径与纯色，兼容 sips。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 暖白纸色底，透明外缘由应用图标自身保留。 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#FAF5EA"/>
  <!-- R 的外轮廓；内腔留作书页，斜腿末端形成书签缺口。 -->
  <path fill="#454A4D" fill-rule="evenodd" d="
    M 296,208 H 596
    C 713,208 780,278 780,376
    C 780,468 720,530 623,544
    L 780,774 L 668,741 L 615,814
    L 440,538 V 512 H 594
    C 673,512 726,469 726,408
    C 726,368 704,343 676,315
    L 617,256
    C 605,248 588,246 568,246 H 296
    Z"/>
  <!-- 书脊与左竖笔：略深的石墨色，保持小尺寸轮廓清晰。 -->
  <path fill="#34393C" d="
    M 306,208 H 404 V 800 H 296
    C 273,800 260,786 260,762 V 250
    C 260,222 277,208 306,208 Z"/>
  <!-- 书脊上端翻开的纸边；不靠渐变和滤镜表现层次。 -->
  <path fill="#FFFCF5" d="
    M 272,246 H 568
    C 588,246 605,248 617,256
    L 676,315
    C 704,343 726,368 726,408
    C 709,384 683,372 648,372 H 629
    C 613,372 606,363 606,347 V 299
    C 606,273 593,258 568,256 H 316
    C 347,263 375,269 393,282
    C 400,287 404,296 404,309 V 285
    C 404,268 384,261 360,257 Z"/>
  <!-- 折页的柔和阴影，仅限小块纸面，避免放大后抢主体。 -->
  <path fill="#E9E3D7" d="
    M 617,256 L 676,315
    C 693,332 707,349 715,368
    C 696,357 675,352 648,352 H 631
    C 622,352 617,347 617,337 Z"/>
</svg>
